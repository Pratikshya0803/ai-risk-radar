name: AI Risk Radar Quick Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  process-comment:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (
        github.event.comment.body == 'a' ||
        github.event.comment.body == 'approve' ||
        github.event.comment.body == 'approved' ||
        github.event.comment.body == 'r' ||
        github.event.comment.body == 'reject' ||
        github.event.comment.body == 'rejected'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Process quick review command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_COMMENT: ${{ github.event.comment.body }}
        run: python scripts/process_comment_review.py
      - name: Save review decision
        run: |
          git config user.name "AI Risk Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending-news.json data/approved-news.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Process quick AI risk review"
          git push